<body>

<nav>

    </a>
    <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Accueil</a></li>

    </ul>
</nav>

<section class="page-section" style="display:flex; align-items:center;">
    <div class="container">

        <div class="section-heading">
            <h2>Contact</h2>
            <div class="underline"></div>
            <p>N'hésitez pas à me contacter</p>
        </div>

        <div class="contact-wrapper">
            <div class="contact-grid">

                <a href="/cdn-cgi/l/email-protection#d5a1bdb4bbbcbbb4beb4bbb4e195b2b8b4bcb9fbb6bab8" class="contact-card">
                    <div class="contact-card-icon">✉️</div>
                    <div class="contact-card-title">Email</div>
                    <div class="contact-card-sub"><span class="__cf_email__" data-cfemail="097d616867606768626867683d496e64686065276a6664">[email&#160;protected]</span></div>

                <a href="https://www.linkedin.com/in/thanina-kana/" target="_blank" rel="noopener" class="contact-card">

                    <div class="contact-card-title">LinkedIn</div>
                    <div class="contact-card-sub">linkedin.com/in/thanina-kana</div>
                </a>

            </div>
        </div>

</section>
<script>
    const btn = document.getElementById('hamburger');
    const menu = document.getElementById('nav-links');
    btn.addEventListener('click', () => {
        btn.classList.toggle('open');
        menu.classList.toggle('open');
    });
    menu.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => {
            btn.classList.remove('open');
            menu.classList.remove('open');
        });
    });
</script>
</body>
